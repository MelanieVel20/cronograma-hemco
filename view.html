<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma SCADA HEMCO – Vista Pública</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: #f5f7fb; margin: 0; padding: 24px; color: #1e293b; }
        .container { max-width: 1600px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 10px 30px -12px rgba(30,58,138,0.15); padding: 28px 30px; border-top: 5px solid #1e3a8a; }
        h1 { font-size: 1.75rem; font-weight: 700; margin: 0 0 0.25rem 0; display: flex; align-items: center; gap: 12px; color: #1e3a8a; }
        h1 i { color: #c8102e; }
        .subhead { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .project-meta { font-size: 0.9rem; color: #1e3a8a; background: #dbeafe; padding: 6px 14px; border-radius: 40px; font-weight: 500; }
        .badge-view { font-size: 0.7rem; background: #94a3b8; color: white; padding: 2px 10px; border-radius: 30px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .updated { font-size: 0.75rem; color: #64748b; margin-left: 10px; }
        .head-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .btn-excel { background: #1e7a46; border: 1px solid #1e7a46; color: white; padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .btn-excel:hover { background: #17633a; }
        .btn-excel:disabled { opacity: .5; cursor: not-allowed; }

        .table-wrapper { overflow: auto; max-height: 480px; border-radius: 12px; border: 1px solid #dbeafe; margin-bottom: 32px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; min-width: 1100px; table-layout: fixed; }
        th { background: #1e3a8a; color: white; padding: 10px 8px; text-align: left; position: sticky; top: 0; font-size: 0.75rem; text-transform: uppercase; white-space: nowrap; }
        td { padding: 8px; border-bottom: 1px solid #eff6ff; }
        .cell { padding: 4px 6px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .task-hito { font-weight: 600; color: #c8102e; }
        .task-resumen { font-style: italic; color: #475569; }

        .gantt-container { background: #fff; border-radius: 12px; padding: 18px 16px 8px 16px; border: 1px solid #dbeafe; margin-top: 10px; position: relative; overflow-x: auto; overflow-y: hidden; }
        .gantt-container::-webkit-scrollbar { height: 12px; }
        .gantt-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 6px; }
        .gantt-container::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 6px; }
        .gantt-container svg { min-width: 100%; height: auto; }
        .gantt .bar-label { display: none !important; }
        .gantt .bar-task { fill: #1e3a8a !important; stroke: #1e40af !important; }
        .gantt .bar-hito { fill: #c8102e !important; stroke: #a6192e !important; }
        .gantt .bar-resumen { fill: #94a3b8 !important; stroke: #64748b !important; }
        /* Solo lectura: sin arrastre ni redimensionado de barras */
        #gantt .bar-wrapper { pointer-events: none; }
        .gantt-label-overlay { position: absolute; pointer-events: none; z-index: 30; white-space: nowrap; font-size: 11.5px; font-weight: 500; padding: 3px 8px; border-radius: 5px; transform: translateY(-50%); }
        .label-tarea { background: #dbeafe; color: #1e3a8a; border: 1px solid #93c5fd; }
        .label-hito { background: #fee2e2; color: #a6192e; border: 1px solid #fca5a5; }
        .label-resumen { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; font-style: italic; }
        .legend { display: flex; gap: 24px; margin: 12px 0 8px 0; font-size: 0.8rem; color: #1e3a8a; }
        .legend-color { width: 20px; height: 14px; border-radius: 3px; display: inline-block; vertical-align: middle; margin-right: 6px; }
        .legend-color.tarea { background: #1e3a8a; }
        .legend-color.hito { background: #c8102e; width: 14px; height: 14px; border-radius: 50%; transform: rotate(45deg); }
        .legend-color.resumen { background: #94a3b8; height: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-chart-gantt"></i> Cronograma SCADA HEMCO</h1>
    <div class="subhead">
        <div class="project-meta"><i class="fas fa-calendar-alt"></i> <span id="projectDate">Mon 28/9/26</span></div>
        <div class="head-right">
            <div><span class="badge-view">Solo lectura</span><span class="updated" id="updatedAt"></span></div>
            <button class="btn-excel" id="exportExcelBtn" disabled><i class="fas fa-file-excel"></i> Exportar a Excel</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="taskTable">
            <thead>
                <tr>
                    <th style="width: 60px;">ID</th>
                    <th style="width: 380px;">Nombre de tarea</th>
                    <th style="width: 110px;">Duración</th>
                    <th style="width: 120px;">Inicio</th>
                    <th style="width: 120px;">Fin</th>
                    <th style="width: 100px;">Tipo</th>
                    <th style="width: 90px;">Progreso</th>
                </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
        </table>
    </div>

    <div class="gantt-container" id="ganttContainer">
        <h3 style="font-weight: 600; font-size: 1.05rem; color: #1e3a8a;"><i class="fas fa-bars-progress" style="color: #c8102e;"></i> Diagrama de Gantt</h3>
        <div class="legend">
            <span><span class="legend-color tarea"></span>Tarea</span>
            <span><span class="legend-color hito"></span>Hito</span>
            <span><span class="legend-color resumen"></span>Resumen</span>
        </div>
        <div id="gantt" style="position: relative;"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
(function() {
    const tbody = document.getElementById('taskTableBody');
    const ganttEl = document.getElementById('gantt');
    let currentTasks = [];
    let ganttSource = [];

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pad = n => String(n).padStart(2, '0');
    const addDaysISO = (iso, n) => { const [y,m,d] = iso.split('-').map(Number); const x = new Date(y, m-1, d+n); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };

    // Siempre la versión más reciente publicada (sin caché)
    function load() {
        fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
            .then(r => r.ok ? r.json() : [])
            .then(data => {
                const json = JSON.stringify(data);
                if (json === JSON.stringify(currentTasks)) return;   // sin cambios
                currentTasks = Array.isArray(data) ? data : [];
                renderTable(currentTasks);
                renderGantt();
                document.getElementById('updatedAt').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-NI', { hour: '2-digit', minute: '2-digit' });
            })
            .catch(() => {
                if (!currentTasks.length)
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#94a3b8;">No se pudo cargar data.json</td></tr>';
            });
    }

    function renderTable(tasks) {
        document.getElementById('exportExcelBtn').disabled = !tasks.length;
        tbody.innerHTML = '';
        if (tasks.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#94a3b8;">No hay tareas publicadas.</td></tr>';
            return;
        }
        tasks.forEach(task => {
            const tr = document.createElement('tr');
            const typeClass = task.type === 'hito' ? 'task-hito' : task.type === 'resumen' ? 'task-resumen' : '';
            tr.innerHTML = `
                <td><span class="cell">${esc(task.id)}</span></td>
                <td><span class="cell ${typeClass}" title="${esc(task.name)}">${esc(task.name)}</span></td>
                <td><span class="cell">${esc(task.duration)}</span></td>
                <td><span class="cell">${esc(task.start)}</span></td>
                <td><span class="cell">${esc(task.finish)}</span></td>
                <td><span class="cell">${esc(task.type || 'tarea')}</span></td>
                <td><span class="cell">${esc(task.progress || 0)}%</span></td>`;
            tbody.appendChild(tr);
        });
    }

    function buildGanttTasks(tasks) {
        ganttSource = tasks.filter(t => t.name && t.start && t.finish);
        return ganttSource.map((t, i) => {
            let cc = 'bar-task';
            if (t.type === 'hito') cc = 'bar-hito';
            if (t.type === 'resumen') cc = 'bar-resumen';
            let end = t.finish;
            if (t.type === 'hito' && t.start === t.finish) end = addDaysISO(t.start, 1);
            return { id: String(t.id || 'x' + i), name: t.name.length > 40 ? t.name.substring(0,37) + '...' : t.name,
                     start: t.start, end, progress: parseInt(t.progress) || 0, dependencies: '', custom_class: cc };
        });
    }

    function overlayLabels() {
        document.querySelectorAll('.gantt-label-overlay').forEach(el => el.remove());
        const container = document.getElementById('ganttContainer');
        if (!document.querySelector('#gantt svg')) return;
        const cRect = container.getBoundingClientRect();
        document.querySelectorAll('#gantt .bar').forEach((bar, idx) => {
            const task = ganttSource[idx];
            if (!task) return;
            const bRect = bar.getBoundingClientRect();
            const label = document.createElement('div');
            label.className = 'gantt-label-overlay ' + (task.type === 'hito' ? 'label-hito' : task.type === 'resumen' ? 'label-resumen' : 'label-tarea');
            label.textContent = task.name.length > 45 ? task.name.substring(0,42) + '...' : task.name;
            label.style.left = (bRect.left - cRect.left + container.scrollLeft + bRect.width + 8) + 'px';
            label.style.top = (bRect.top - cRect.top + bRect.height / 2) + 'px';
            container.appendChild(label);
        });
    }

    function renderGantt() {
        const tasks = buildGanttTasks(currentTasks);
        ganttEl.innerHTML = '';
        document.querySelectorAll('.gantt-label-overlay').forEach(el => el.remove());
        if (tasks.length === 0) {
            ganttEl.innerHTML = '<div style="text-align:center;padding:60px;color:#94a3b8;">Sin datos.</div>';
            return;
        }
        new Gantt('#gantt', tasks, {
            header_height: 50, column_width: 30, step: 24, bar_height: 22,
            bar_corner_radius: 3, padding: 18, view_mode: 'Month',
            date_format: 'YYYY-MM-DD', language: 'es'
        });
        setTimeout(() => {
            document.querySelectorAll('#gantt .bar').forEach((bar, idx) => {
                const t = tasks[idx]; if (!t) return;
                bar.classList.remove('bar-task','bar-hito','bar-resumen');
                bar.classList.add(t.custom_class);
            });
            overlayLabels();
            const c = document.getElementById('ganttContainer');
            if (!c.dataset.scrollListener) {
                c.dataset.scrollListener = 'true';
                c.addEventListener('scroll', overlayLabels);
                window.addEventListener('resize', overlayLabels);
            }
        }, 150);
    }

    // ============ EXPORTAR A EXCEL (con formato) ============
    function buildWorkbook(ExcelJS, tasks, projectDate) {
        const C = {
            navy: 'FF1E3A8A', navyDark: 'FF172554', red: 'FFC8102E', redSoft: 'FFFEE2E2',
            blueSoft: 'FFDBEAFE', blueRow: 'FFF5F8FF', gray: 'FF94A3B8', graySoft: 'FFF1F5F9',
            text: 'FF1E293B', muted: 'FF64748B', border: 'FFE2E8F0', white: 'FFFFFFFF'
        };
        const fill = argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
        const thin = { style: 'thin', color: { argb: C.border } };
        const box = { top: thin, left: thin, bottom: thin, right: thin };
        const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
        const TIPO = { tarea: 'Tarea', hito: 'Hito', resumen: 'Resumen' };
        const p2 = n => String(n).padStart(2, '0');
        const toDate = iso => {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '').trim());
            return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null;
        };
        const now = new Date();
        const exportado = `${p2(now.getDate())}/${p2(now.getMonth()+1)}/${now.getFullYear()} ${p2(now.getHours())}:${p2(now.getMinutes())}`;

        const tareas = tasks.filter(t => (t.type || 'tarea') === 'tarea');
        const hitos = tasks.filter(t => t.type === 'hito');
        const avance = tareas.length ? tareas.reduce((s, t) => s + (parseFloat(t.progress) || 0), 0) / tareas.length / 100 : 0;

        const wb = new ExcelJS.Workbook();
        wb.creator = 'MISSA'; wb.created = now; wb.title = 'Cronograma SCADA HEMCO';

        // ---------- Hoja 1: Cronograma ----------
        const ws = wb.addWorksheet('Cronograma', {
            views: [{ state: 'frozen', ySplit: 5, showGridLines: false }],
            pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
                         margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 }, printTitlesRow: '5:5' },
            headerFooter: { oddFooter: '&L&8Cronograma SCADA HEMCO&R&8Página &P de &N' }
        });
        ws.columns = [{ width: 7 }, { width: 50 }, { width: 13 }, { width: 13 }, { width: 13 }, { width: 12 }, { width: 11 }, { width: 14 }];

        ws.mergeCells('A1:H1');
        ws.getCell('A1').value = 'Cronograma SCADA HEMCO';
        ws.getCell('A1').font = { name: 'Calibri', size: 18, bold: true, color: { argb: C.white } };
        ws.getCell('A1').fill = fill(C.navy);
        ws.getCell('A1').alignment = { vertical: 'middle', indent: 1 };
        ws.getRow(1).height = 36;

        ws.mergeCells('A2:H2');
        ws.getCell('A2').value = `Fecha del proyecto: ${projectDate || '—'}     ·     Exportado: ${exportado}`;
        ws.getCell('A2').font = { size: 10, italic: true, color: { argb: C.white } };
        ws.getCell('A2').fill = fill(C.navyDark);
        ws.getCell('A2').alignment = { vertical: 'middle', indent: 1 };
        ws.getRow(2).height = 20;

        // Fila de indicadores
        const kpis = [['A3:B3', `Actividades: ${tasks.length}`], ['C3:D3', `Hitos: ${hitos.length}`], ['E3:H3', null]];
        kpis.forEach(([rng, txt]) => {
            ws.mergeCells(rng);
            const cell = ws.getCell(rng.split(':')[0]);
            cell.value = txt;
            cell.font = { bold: true, size: 11, color: { argb: C.navy } };
            cell.fill = fill(C.blueSoft);
            cell.alignment = { vertical: 'middle', horizontal: 'center' };
        });
        ws.getCell('E3').value = { richText: [
            { text: 'Avance promedio de tareas: ', font: { bold: true, size: 11, color: { argb: C.navy } } },
            { text: `${Math.round(avance * 100)}%`, font: { bold: true, size: 12, color: { argb: C.red } } }
        ] };
        ws.getRow(3).height = 24;
        ws.getRow(4).height = 6;

        const header = ws.getRow(5);
        header.values = ['ID', 'Nombre de tarea', 'Duración', 'Inicio', 'Fin', 'Tipo', 'Progreso', 'Estado'];
        header.height = 24;
        header.eachCell(cell => {
            cell.font = { bold: true, color: { argb: C.white }, size: 11 };
            cell.fill = fill(C.navy);
            cell.alignment = { vertical: 'middle', horizontal: 'center' };
            cell.border = { top: thin, left: thin, right: thin, bottom: { style: 'medium', color: { argb: C.red } } };
        });

        let r = 6;
        tasks.forEach((t, i) => {
            const type = t.type || 'tarea';
            const row = ws.getRow(r);
            row.values = [
                String(t.id ?? ''),
                (type === 'hito' ? '◆ ' : '') + String(t.name ?? ''),
                String(t.duration ?? ''),
                toDate(t.start) || String(t.start ?? ''),
                toDate(t.finish) || String(t.finish ?? ''),
                TIPO[type] || type,
                (parseFloat(t.progress) || 0) / 100,
                ''
            ];
            row.height = 20;
            const bg = type === 'resumen' ? C.graySoft : type === 'hito' ? 'FFFFF5F5' : (i % 2 ? C.blueRow : C.white);
            row.eachCell({ includeEmpty: true }, (cell, col) => {
                cell.fill = fill(bg);
                cell.border = box;
                cell.alignment = { vertical: 'middle', horizontal: col === 2 ? 'left' : 'center', indent: col === 2 ? 1 : 0 };
                cell.font = { size: 10.5, color: { argb: C.text } };
                if (type === 'resumen') cell.font = { size: 10.5, bold: true, italic: true, color: { argb: 'FF334155' } };
                if (type === 'hito') cell.font = { size: 10.5, bold: true, color: { argb: C.red } };
            });
            row.getCell(4).numFmt = 'dd/mm/yyyy';
            row.getCell(5).numFmt = 'dd/mm/yyyy';
            row.getCell(7).numFmt = '0%';
            const tipoCell = row.getCell(6);
            tipoCell.font = { size: 9.5, bold: true, color: { argb: type === 'hito' ? C.red : type === 'resumen' ? C.muted : C.navy } };
            // Estado según avance (colores fijos: abren bien en cualquier Excel)
            const pct = parseFloat(t.progress) || 0;
            const est = pct >= 100 ? (type === 'hito' ? ['Cumplido', 'FFDCFCE7', 'FF166534'] : ['Completado', 'FFDCFCE7', 'FF166534'])
                      : pct > 0 ? ['En curso', 'FFFEF3C7', 'FF92400E'] : ['Pendiente', C.graySoft, C.muted];
            const estCell = row.getCell(8);
            estCell.value = est[0];
            estCell.fill = fill(est[1]);
            estCell.font = { size: 9.5, bold: true, color: { argb: est[2] } };
            const pCell = row.getCell(7);
            pCell.fill = fill(est[1]);
            pCell.font = { size: 10.5, bold: true, color: { argb: est[2] } };
            r++;
        });
        const last = r - 1;

        if (last >= 6) ws.autoFilter = { from: 'A5', to: `H${last}` };

        ws.mergeCells(`A${last + 2}:H${last + 2}`);
        ws.getCell(`A${last + 2}`).value = 'Generado desde el cronograma en línea. Los datos corresponden a la última versión publicada.';
        ws.getCell(`A${last + 2}`).font = { size: 9, italic: true, color: { argb: C.muted } };

        // ---------- Hoja 2: Gantt semanal ----------
        const dated = tasks.map(t => ({ t, s: toDate(t.start), f: toDate(t.finish) })).filter(x => x.s && x.f);
        if (dated.length) {
            const DAY = 86400000;
            const minS = new Date(Math.min(...dated.map(x => x.s.getTime())));
            const maxF = new Date(Math.max(...dated.map(x => x.f.getTime())));
            const monday = new Date(minS.getTime() - ((minS.getUTCDay() + 6) % 7) * DAY);
            const weeks = [];
            for (let w = monday.getTime(); w <= maxF.getTime() && weeks.length < 260; w += 7 * DAY) weeks.push(new Date(w));

            const FIRST = 5;   // primera columna de semanas (E)
            const lastCol = FIRST + weeks.length - 1;
            const gs = wb.addWorksheet('Gantt', {
                views: [{ state: 'frozen', xSplit: 4, ySplit: 4, showGridLines: false }],
                pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
                             margins: { left: 0.3, right: 0.3, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 }, printTitlesRow: '3:4' }
            });
            gs.getColumn(1).width = 6; gs.getColumn(2).width = 40; gs.getColumn(3).width = 11; gs.getColumn(4).width = 11;
            weeks.forEach((_, i) => { gs.getColumn(FIRST + i).width = 5.2; });

            gs.mergeCells(1, 1, 1, lastCol);
            gs.getCell(1, 1).value = 'Diagrama de Gantt · SCADA HEMCO (vista semanal)';
            gs.getCell(1, 1).font = { size: 16, bold: true, color: { argb: C.white } };
            gs.getCell(1, 1).fill = fill(C.navy);
            gs.getCell(1, 1).alignment = { vertical: 'middle', indent: 1 };
            gs.getRow(1).height = 32;

            // Leyenda
            gs.mergeCells(2, 1, 2, lastCol);
            gs.getCell(2, 1).value = { richText: [
                { text: '■ ', font: { color: { argb: C.navy }, size: 12 } }, { text: 'Tarea     ', font: { size: 10, color: { argb: C.text } } },
                { text: '■ ', font: { color: { argb: C.gray }, size: 12 } }, { text: 'Resumen     ', font: { size: 10, color: { argb: C.text } } },
                { text: '◆ ', font: { color: { argb: C.red }, size: 12 } }, { text: 'Hito     ', font: { size: 10, color: { argb: C.text } } },
                { text: `Exportado: ${exportado}`, font: { size: 9, italic: true, color: { argb: C.muted } } }
            ] };
            gs.getCell(2, 1).fill = fill(C.blueSoft);
            gs.getCell(2, 1).alignment = { vertical: 'middle', indent: 1 };
            gs.getRow(2).height = 20;

            // Encabezados: meses (fila 3) y semanas (fila 4)
            ['ID', 'Actividad', 'Inicio', 'Fin'].forEach((h, i) => {
                gs.mergeCells(3, i + 1, 4, i + 1);
                const c = gs.getCell(3, i + 1);
                c.value = h;
                c.font = { bold: true, color: { argb: C.white } };
                c.fill = fill(C.navy);
                c.alignment = { vertical: 'middle', horizontal: 'center' };
                c.border = box;
            });
            let startIdx = 0;
            for (let i = 1; i <= weeks.length; i++) {
                const cur = weeks[startIdx], nxt = weeks[i];
                if (i === weeks.length || nxt.getUTCMonth() !== cur.getUTCMonth()) {
                    const c1 = FIRST + startIdx, c2 = FIRST + i - 1;
                    if (c2 > c1) gs.mergeCells(3, c1, 3, c2);
                    const c = gs.getCell(3, c1);
                    c.value = `${MESES[cur.getUTCMonth()]} ${cur.getUTCFullYear()}`;
                    c.font = { bold: true, color: { argb: C.white }, size: 10 };
                    c.fill = fill(C.navyDark);
                    c.alignment = { horizontal: 'center', vertical: 'middle' };
                    c.border = box;
                    startIdx = i;
                }
            }
            weeks.forEach((w, i) => {
                const c = gs.getCell(4, FIRST + i);
                c.value = p2(w.getUTCDate());
                c.font = { size: 8.5, bold: true, color: { argb: C.navy } };
                c.fill = fill(C.blueSoft);
                c.alignment = { horizontal: 'center', vertical: 'middle' };
                c.border = box;
            });
            gs.getRow(3).height = 18; gs.getRow(4).height = 16;

            dated.forEach(({ t, s, f }, i) => {
                const row = 5 + i, type = t.type || 'tarea';
                const r0 = gs.getRow(row);
                r0.height = 18;
                const vals = [String(t.id ?? ''), (type === 'hito' ? '◆ ' : '') + String(t.name ?? ''), s, f];
                vals.forEach((v, k) => {
                    const c = gs.getCell(row, k + 1);
                    c.value = v;
                    c.border = box;
                    c.alignment = { vertical: 'middle', horizontal: k === 1 ? 'left' : 'center', indent: k === 1 ? 1 : 0 };
                    c.font = { size: 10, color: { argb: type === 'hito' ? C.red : C.text }, bold: type !== 'tarea', italic: type === 'resumen' };
                    if (type === 'resumen') c.fill = fill(C.graySoft);
                });
                gs.getCell(row, 3).numFmt = 'dd/mm/yy';
                gs.getCell(row, 4).numFmt = 'dd/mm/yy';
                weeks.forEach((w, k) => {
                    const c = gs.getCell(row, FIRST + k);
                    const wEnd = w.getTime() + 6 * DAY;
                    const vBorder = { left: { style: 'hair', color: { argb: C.border } }, right: { style: 'hair', color: { argb: C.border } },
                                      top: thin, bottom: thin };
                    c.border = vBorder;
                    if (type === 'hito') {
                        if (s.getTime() >= w.getTime() && s.getTime() <= wEnd) {
                            c.value = '◆';
                            c.font = { color: { argb: C.red }, bold: true, size: 12 };
                            c.alignment = { horizontal: 'center', vertical: 'middle' };
                        }
                    } else if (w.getTime() <= f.getTime() && wEnd >= s.getTime()) {
                        c.fill = fill(type === 'resumen' ? C.gray : C.navy);
                    }
                });
            });
        }
        return wb;
    }

    async function exportExcel(tasks) {
        if (!tasks || !tasks.length) return alert('No hay tareas para exportar.');
        if (typeof ExcelJS === 'undefined') return alert('No se pudo cargar el componente de Excel. Revisa tu conexión y recarga la página.');
        const btn = document.getElementById('exportExcelBtn');
        if (btn) btn.disabled = true;
        try {
            const projectDate = (document.getElementById('projectDate') || {}).textContent || '';
            const wb = buildWorkbook(ExcelJS, tasks, projectDate.trim());
            const buf = await wb.xlsx.writeBuffer();
            const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const url = URL.createObjectURL(blob);
            const d = new Date(), p2 = n => String(n).padStart(2, '0');
            const a = document.createElement('a');
            a.href = url;
            a.download = `Cronograma_SCADA_HEMCO_${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}.xlsx`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
        } catch (e) {
            alert('No se pudo generar el Excel: ' + e.message);
        } finally {
            if (btn) btn.disabled = false;
        }
    }

    document.getElementById('exportExcelBtn').addEventListener('click', () => exportExcel(currentTasks));

    load();
    setInterval(load, 120000);   // revisa cambios cada 2 minutos
})();
</script>
